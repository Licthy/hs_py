<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemPalace — 记忆宫殿</title>
<style>
:root {
  --bg: #ffffff;
  --bg2: #f6f8fa;
  --border: #d0d7de;
  --text: #1f2328;
  --text2: #656d76;
  --accent: #0969da;
  --accent2: #1a7f37;
  --danger: #cf222e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
}
.sidebar {
  width: 260px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--border);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}
.sidebar-header small { font-size:12px; color:var(--text2); display:block; }
.wing-list { flex:1; overflow-y:auto; padding:8px 0; }
.wing-item {
  padding: 6px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}
.wing-item:hover { background: #eaeef2; }
.wing-item.active { background: #ddf4ff; color: var(--accent); }
.wing-item .count { margin-left:auto; font-size:12px; color:var(--text2); }
.room-list { display:none; }
.room-list.open { display:block; }
.room-item {
  padding: 4px 16px 4px 36px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text2);
}
.room-item:hover { background: #eaeef2; color: var(--text); }
.room-item.active { background: #ddf4ff; color: var(--accent); }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text2);
}
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.topbar {
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 12px;
  align-items: center;
}
.topbar input {
  flex: 1;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  outline: none;
}
.topbar input:focus { border-color: var(--accent); }
.topbar button {
  padding: 8px 18px;
  border: 1px solid var(--accent);
  border-radius: 6px;
  background: var(--accent);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
.topbar button:hover { opacity: .85; }
.topbar button.secondary {
  background: transparent;
  border-color: var(--border);
  color: var(--text2);
}
.stats-bar {
  display: flex;
  gap: 16px;
  padding: 8px 20px;
  font-size: 12px;
  color: var(--text2);
  border-bottom: 1px solid var(--border);
}
.stats-bar .filter-tag {
  background: #ddf4ff;
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 4px;
  cursor: pointer;
}
.stats-bar .filter-tag:hover { opacity: .8; }
.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}
.empty-state {
  text-align: center;
  color: var(--text2);
  padding: 80px 20px;
  font-size: 16px;
}
.loading { text-align:center; padding:40px; color:var(--text2); }
.error { color:var(--danger); padding:10px; }
pre.content-block {
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
  padding: 16px;
  font-family: 'Cascadia Code', 'Fira Code', monospace;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    MemPalace
    <small>记忆宫殿管理</small>
  </div>
  <div class="wing-list" id="wingList">
    <div class="loading">加载中...</div>
  </div>
  <div class="sidebar-footer" id="sidebarStats"></div>
</div>

<div class="main">
  <div class="topbar">
    <input type="text" id="searchInput" placeholder="搜索记忆... (支持语义搜索)" onkeydown="if(event.key==='Enter')search()">
    <button onclick="search()">搜索</button>
    <button class="secondary" onclick="clearFilters()">清除</button>
  </div>
  <div class="stats-bar" id="statsBar"></div>
  <div class="content" id="content">
    <div class="empty-state">选择一个 Wing 查看内容，或使用上方搜索框</div>
  </div>
</div>

<script>
let wingsData = [];
let activeWing = null;
let activeRoom = null;

async function api(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadStatus() {
  try {
    const data = await api('/api/status');
    wingsData = data.wings || [];
    renderSidebar();
  } catch(e) {
    document.getElementById('wingList').innerHTML = '<div class="error">'+e.message+'</div>';
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSidebar() {
  const el = document.getElementById('wingList');
  if (!wingsData.length) { el.innerHTML = '<div class="empty-state">暂无数据</div>'; return; }
  let total = 0;
  let html = '';
  wingsData.forEach((w, wi) => {
    const t = w.rooms.reduce((s, r) => s + parseInt(r.drawers || 0), 0);
    total += t;
    html += '<div class="wing-item'+(activeWing===wi?' active':'')+'" onclick="clickWing('+wi+')">';
    html += esc(w.name)+' <span class="count">'+t.toLocaleString()+'</span></div>';
    html += '<div class="room-list'+(activeWing===wi?' open':'')+'">';
    w.rooms.forEach((r, ri) => {
      html += '<div class="room-item'+(activeWing===wi&&activeRoom===ri?' active':'')+'" onclick="clickRoom('+wi+','+ri+')">';
      html += esc(r.name)+' <span style="float:right;font-size:11px">'+parseInt(r.drawers||0).toLocaleString()+'</span></div>';
    });
    html += '</div>';
  });
  el.innerHTML = html;
  document.getElementById('sidebarStats').innerHTML = '总计 <strong>'+total.toLocaleString()+'</strong> drawers';
}

function clickWing(wi) {
  if (activeWing === wi) { activeWing = null; activeRoom = null; }
  else { activeWing = wi; activeRoom = null; }
  renderSidebar();
  updateFilterBar();
  if (activeWing !== null) {
    doSearch('');
  } else {
    document.getElementById('content').innerHTML = '<div class="empty-state">选择一个 Wing 查看内容，或使用上方搜索框</div>';
  }
}

function clickRoom(wi, ri) {
  activeWing = wi; activeRoom = ri;
  renderSidebar();
  updateFilterBar();
  doSearch('');
}

function updateFilterBar() {
  let html = '';
  if (activeWing !== null) {
    html += '<span class="filter-tag" onclick="clickWing('+activeWing+')">'+esc(wingsData[activeWing].name)+'</span>';
  }
  if (activeRoom !== null) {
    html += ' <span class="filter-tag" onclick="clickRoom('+activeWing+','+activeRoom+')">'+esc(wingsData[activeWing].rooms[activeRoom].name)+'</span>';
  }
  document.getElementById('statsBar').innerHTML = html || '全部';
}

function clearFilters() {
  activeWing = null;
  activeRoom = null;
  document.getElementById('searchInput').value = '';
  renderSidebar();
  updateFilterBar();
  document.getElementById('content').innerHTML = '<div class="empty-state">选择一个 Wing 查看内容，或使用上方搜索框</div>';
}

async function search() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q && activeWing === null) return;
  doSearch(q);
}

async function doSearch(q) {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">搜索中...</div>';
  try {
    const params = new URLSearchParams({q: q || ' '});
    if (activeWing !== null) params.set('wing', wingsData[activeWing].name);
    if (activeRoom !== null && activeWing !== null) params.set('room', wingsData[activeWing].rooms[activeRoom].name);
    const data = await api('/api/search?' + params);
    content.innerHTML = '<pre class="content-block">'+esc(data.results || '无结果')+'</pre>';
  } catch(e) {
    content.innerHTML = '<div class="error">搜索失败: '+e.message+'</div>';
  }
}

loadStatus();
</script>
</body>
</html>
